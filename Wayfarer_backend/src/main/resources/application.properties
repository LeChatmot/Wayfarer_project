spring.application.name=wayfarer-backend
spring.config.import=optional:configtree:/run/secrets/

# PostgreSQL/PostGIS
spring.datasource.url=jdbc:postgresql://postgres:5432/wayfarer
spring.datasource.username=${POSTGRES_USER:${postgres_user:}}
spring.datasource.password=${POSTGRES_PASSWORD:${postgres_password:}}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# Monitoring / Actuator
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.prometheus.enabled=true
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name:wayfarer-backend}

# Securite
spring.security.user.name=${SPRING_SECURITY_USER:admin}
spring.security.user.password=${SPRING_SECURITY_PASSWORD:admin}
spring.security.user.roles=ADMIN,USER

# JWT
jwt.secret=${JWT_SECRET:${jwt_secret:}}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# DevOps
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

logging.config=classpath:logback-spring.xml
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ---------- Serveur ----------
server.port=${SERVER_PORT:8080}