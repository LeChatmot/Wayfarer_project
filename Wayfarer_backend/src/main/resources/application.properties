spring.application.name=wayfarer-backend
spring.config.import=optional:configtree:/run/secrets/

# PostgreSQL/PostGIS
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:5432/wayfarer
spring.datasource.username=${POSTGRES_USER:}
spring.datasource.password=${POSTGRES_PASSWORD:}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# Monitoring / Actuator
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.prometheus.enabled=true
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name:wayfarer-backend}

# Securite
spring.security.user.name=${SPRING_SECURITY_USER:admin}
spring.security.user.password=${SPRING_SECURITY_PASSWORD:admin}
spring.security.user.roles=ADMIN,USER
app.security.encryption-key=${ENCRYPTION-SECRET:${encryption-secret}}
app.security.hmac-key=${HASH-SECRET:${hash-secret:}}

# JWT
jwt.secret=${JWT_SECRET:${jwt_secret:}}
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=604800000

# DevOps
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

logging.config=classpath:logback-spring.xml

# ---------- Serveur ----------
app.cors.allowed-origins=http://localhost:80, http://localhost:4200
spring.servlet.multipart.max-file-size=8MB
server.port=${SERVER_PORT:8080}
app.cookie.secure=${COOKIE_SECURE:false}

wayfarer.storage.hike-previews-path=${WAYFARER-HIKE-PREVIEW-FOLDER:/var/wayfarer/hike-previews}
wayfarer.storage.hike-previews-public-url=/static/hike-previews