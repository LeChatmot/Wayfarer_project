<h2 mat-dialog-title>{{ data ? "Modifier l'objet" : 'Ajouter un objet' }}</h2>
<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content class="flex flex-col gap-4 pt-2">
    <mat-form-field appearance="outline">
      <mat-label>Nom</mat-label>
      <input matInput formControlName="name" maxlength="60" />
      @if (form.controls.name.hasError('required')) {
        <mat-error>Le nom est obligatoire</mat-error>
      }
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Quantité</mat-label>
      <input matInput type="number" min="0" formControlName="quantity" />
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button type="button" mat-dialog-close>Annuler</button>
    <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid">
      {{ data ? 'Enregistrer' : 'Ajouter' }}
    </button>
  </mat-dialog-actions>
</form>
