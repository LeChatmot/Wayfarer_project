services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: postgres-wayfarer-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wayfarer
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d wayfarer" ]
      interval: 5s
      timeout: 5s
      retries: 15

  loki:
    image: grafana/loki:2.9.4
    container_name: loki-wayfarer
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/loki-config.yml
    networks:
      - dev-network
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:3100/ready" ]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
    labels:
      - "traefik.enable=false"

networks:
  dev-network:
    driver: bridge

volumes:
  postgres_dev_data:
  loki_data: