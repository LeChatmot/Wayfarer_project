services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: postgres-wayfarer-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wayfarer
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - dev-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d wayfarer" ]
      interval: 5s
      timeout: 5s
      retries: 15

  backend:
    build:
      context: ./Wayfarer_backend
      dockerfile: Dockerfile.dev
    container_name: backend-wayfarer-dev
    depends_on:
      postgres:
        condition: service_healthy
      loki:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8080
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: wayfarer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      JWT_SECRET: ZGV2LXNlY3JldC1rZXktd2F5ZmFyZXItcHJvamVjdC1taW5pbXVtLTI1Ni1iaXRz
    volumes:
      - ./Wayfarer_backend/src:/app/src
      - ./Wayfarer_backend/pom.xml:/app/pom.xml
      - backend_maven_repo:/root/.m2
    ports:
      - "8080:8080"
    networks:
      - dev-network

  frontend:
    build:
      context: ./Wayfarer_frontend
      dockerfile: Dockerfile.dev
    container_name: frontend-wayfarer-dev
    volumes:
      - ./Wayfarer_frontend:/app
      - /app/node_modules
    ports:
      - "4200:4200"
    networks:
      - dev-network
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./Wayfarer_frontend/nginx.dev.conf:/etc/nginx/conf.d/default.conf
    networks:
      - dev-network
    depends_on:
      - frontend
      - backend

  loki:
    image: grafana/loki:2.9.4
    container_name: loki-wayfarer
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/loki-config.yml
    networks:
      - dev-network
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:3100/ready" ]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
    labels:
      - "traefik.enable=false"

networks:
  dev-network:
    driver: bridge

volumes:
  postgres_dev_data:
  backend_maven_repo:
  loki_data: