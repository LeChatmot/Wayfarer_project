server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: backend-logs
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        filters:
          - name: name
            values: ["backend-wayfarer-project"]
    pipeline_stages:
      - docker: {}
      - json:
          expressions:
            timestamp: '"@timestamp"'
            message: message
            level: level
            logger: logger
            thread: thread
            stack_trace: stack_trace
      - labels:
          level:
          logger: